# Publishes to npm when a version tag is pushed:  npm version patch && git push --follow-tags
# Uses npm Trusted Publishing (OIDC): no token in the repo, and every version gets a signed provenance badge.
# One-time setup on npmjs.com: package -> Settings -> Trusted Publisher -> GitHub Actions,
#   owner Gildaciolopes, repository agentic-dev-stack, workflow release.yml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # retry a release whose tag run failed or got stuck: gh workflow run release.yml -f tag=v1.2.3
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != package.json v$v"; exit 1; }

      - name: Test
        run: npm test
        env:
          ALETHE_IT: "1"

      - name: Publish to npm (trusted publishing, provenance)
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance

      - name: GitHub release (notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
