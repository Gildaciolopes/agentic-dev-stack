name: Bug report
description: Something in the installer, CLI, hooks or docs doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Paste the relevant lines. **Remove tokens, keys and personal paths first.**
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: "`npx agentic-dev-stack doctor` output"
      render: text
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, Windows (WSL2)]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "agentic-dev-stack 1.1.0, node 22.11, claude 2.x"
